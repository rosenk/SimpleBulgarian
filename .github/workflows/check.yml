name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 evals/bg_lint.py --self-test
      - run: node --test src/hooks/simple-bulgarian-activate.test.js
      - run: python3 src/hooks/test_lint_hook.py
      - run: for f in .claude-plugin/*.json .codex-plugin/*.json .agents/plugins/*.json; do python3 -m json.tool "$f" > /dev/null; done
